[project]
name = "jepa-chat"
version = "0.1.0"
description = "Experimental chat assistant built on a Joint-Embedding Predictive Architecture (JEPA), with a mixture of LLM backends."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "anon5376" }]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "mcp>=2.1,<3",
    "httpx>=0.27",
    "textual>=8.0",
    "textual-plotext>=1.0",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]
serve = [
    "textual-serve>=1.1",
]

[project.scripts]
jepa-chat = "jepa_chat.inference.chat:main"
jepa-train = "jepa_chat.training.train:main"
jepa-ingest = "jepa_chat.ingest.cli:main"
jepa-pretrain = "jepa_chat.training.pretrain:main"
jepa-eval = "jepa_chat.training.evaluate:main"
jepa-core = "jepa_chat.core.cli:main"
jepa-mcp = "jepa_chat.mcp.proxy:main"
jepa-tui = "jepa_chat.tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jepa_chat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
